name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build packages
        run: python3 build.py

      - name: Validate manifests
        run: |
          python3 - <<'PY'
          import json, zipfile, pathlib
          for name in ('firefox', 'chromium'):
              z = zipfile.ZipFile(f'release/rutube-tools-{name}.zip')
              m = json.loads(z.read('manifest.json'))
              assert m['manifest_version'] == 3, name
              assert 'content-core.js' in z.namelist(), name
              print(name, 'ok ·', m['version'], '·', len(z.namelist()), 'files')
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rutube-tools
          path: release/*
          if-no-files-found: error

      - name: Заметки только для этой версии
        id: notes
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          version = json.loads(pathlib.Path('src/manifest.firefox.json').read_text())['version']
          changelog = pathlib.Path('docs/CHANGELOG.md').read_text(encoding='utf-8')
          m = re.search(rf'^## {re.escape(version)}\b.*?(?=^## |\Z)', changelog, re.S | re.M)
          body = m.group(0).strip() if m else f'Версия {version}.'
          out = pathlib.Path('release-notes.md')
          out.write_text(body + '\n', encoding='utf-8')
          print(f'заметки для {version}: {len(body)} символов')
          PY
          echo "file=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/rutube-tools-firefox.xpi
            release/rutube-tools-firefox.zip
            release/rutube-tools-chromium.zip
          body_path: ${{ steps.notes.outputs.file }}
