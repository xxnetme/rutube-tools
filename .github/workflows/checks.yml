name: Checks

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Node dependencies
        run: npm ci

      - name: JS syntax
        run: |
          for f in $(find src -name '*.js' ! -name 'mux*'); do
            node --check "$f" || exit 1
          done
          echo "синтаксис в порядке"

      - name: Тесты
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm test

      - name: Валидатор монитора API — unit-тесты без сети
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: ESLint
        run: npm run lint

      - name: JSDoc — tsc --checkJs
        run: npm run typecheck

      - name: Build
        run: python3 build.py

      - name: Контрольные суммы пакетов
        working-directory: release
        run: sha256sum -c SHA256SUMS

      - name: No remote code / eval
        run: |
          if grep -RnE "eval\(|new Function\(|https?://[^\"' ]+\.js" src --include='*.js' | grep -v 'mux'; then
            echo "::error::найден eval или внешний скрипт"; exit 1
          fi
          echo "чисто"

      - name: addons-linter
        run: |
          # мажорная версия закреплена: иначе новый релиз линтера однажды уронит
          # сборку без единой правки в коде. обновлять осознанно.
          npx --yes addons-linter@10 release/rutube-tools-firefox.zip
          echo "addons-linter прошёл"

      - name: Версии совпадают
        run: python3 tools/check-versions.py

      - name: Размеры картинок в разметке
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/check-images.py

      - name: Лендинг и политика собираются
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          for f in ('docs/index.html', 'docs/privacy.html'):
              html = pathlib.Path(f).read_text(encoding='utf-8')
              assert '<html lang="ru">' in html, f
              assert html.count('<h1') == 1, f + ': заголовков h1 не один'
          html = pathlib.Path('docs/index.html').read_text(encoding='utf-8')
          data = json.loads(html.split('type="application/ld+json">', 1)[1].split('</script>', 1)[0])
          assert data['@graph'], 'JSON-LD пуст'
          print('страницы в порядке, JSON-LD парсится')
          PY

  browser-e2e:
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Node and WebDriver dependencies
        run: |
          npm ci
          python3 -m pip install --quiet -r tests/e2e/requirements.txt

      - name: Browsers and ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npx playwright install --with-deps chromium firefox

      - name: Реальное расширение в Firefox и Chromium
        run: npm run test:e2e

      - name: Отчёты, сеть и скачанные MP4
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-e2e
          path: tmp/e2e/
          if-no-files-found: warn
          retention-days: 14
