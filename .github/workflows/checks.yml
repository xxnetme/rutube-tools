name: Checks

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS syntax
        run: |
          for f in $(find src -name '*.js' ! -name 'mux*'); do
            node --check "$f" || exit 1
          done
          echo "синтаксис в порядке"

      - name: Build
        run: python3 build.py

      - name: No remote code / eval
        run: |
          if grep -RnE "eval\(|new Function\(|https?://[^\"' ]+\.js" src --include='*.js' | grep -v 'mux'; then
            echo "::error::найден eval или внешний скрипт"; exit 1
          fi
          echo "чисто"

      - name: addons-linter
        run: |
          # мажорная версия закреплена: иначе новый релиз линтера однажды уронит
          # сборку без единой правки в коде. обновлять осознанно.
          npx --yes addons-linter@10 release/rutube-tools-firefox.zip
          echo "addons-linter прошёл"

      - name: Версии совпадают
        run: python3 tools/check-versions.py

      - name: Лендинг и политика собираются
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          for f in ('docs/index.html', 'docs/privacy.html'):
              html = pathlib.Path(f).read_text(encoding='utf-8')
              assert '<html lang="ru">' in html, f
              assert html.count('<h1') == 1, f + ': заголовков h1 не один'
          html = pathlib.Path('docs/index.html').read_text(encoding='utf-8')
          data = json.loads(html.split('type="application/ld+json">', 1)[1].split('</script>', 1)[0])
          assert data['@graph'], 'JSON-LD пуст'
          print('страницы в порядке, JSON-LD парсится')
          PY
