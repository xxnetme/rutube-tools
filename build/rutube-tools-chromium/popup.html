<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>RuTube Tools</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 336px; padding: 16px 16px 14px;
    background: #17171a; color: #f1f1f4;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .2px; display: flex; align-items: center; gap: 8px; }
  h1 .badge { font-size: 9px; font-weight: 700; letter-spacing: .7px; color: #ff6b6b; border: 1px solid rgba(255,107,107,.45); border-radius: 5px; padding: 1px 5px; }
  .sub { color: #8d8d97; font-size: 11px; margin-bottom: 14px; }
  .field { margin-bottom: 11px; }
  label.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; }
  .label { color: #c9c9d1; font-size: 12px; }
  select {
    background: #232327; color: #f1f1f4; border: 1px solid #34343a; border-radius: 7px;
    padding: 5px 7px; font-size: 12px; font-family: inherit; min-width: 108px;
  }
  select:focus { outline: 1px solid #ff4d4d; }
  input[type=checkbox] { appearance: none; width: 34px; height: 19px; border-radius: 99px; background: #34343a; position: relative; cursor: pointer; transition: background .15s; flex: 0 0 auto; border: 0; }
  input[type=checkbox]:checked { background: #ff3b3b; }
  input[type=checkbox]::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; transition: transform .15s; }
  input[type=checkbox]:checked::after { transform: translateX(15px); }
  .hint { color: #7b7b86; font-size: 11px; margin-top: 3px; line-height: 1.4; }
  .sep { height: 1px; background: #2a2a2f; margin: 12px 0; }
  .keys { font-size: 11.5px; color: #9d9da8; line-height: 1.6; }
  kbd { background: #2a2a30; border: 1px solid #3a3a42; border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font-family: inherit; font-size: 11px; color: #e6e6ec; }
  .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 13px; }
  .ver { color: #63636d; font-size: 10.5px; }
  button { background: #26262b; color: #cfcfd6; border: 1px solid #34343a; border-radius: 7px; padding: 5px 10px; font-size: 11.5px; font-family: inherit; cursor: pointer; }
  button:hover { background: #303036; color: #fff; }
  :focus-visible { outline: 2px solid #ff6b6b; outline-offset: 2px; }
</style>
</head>
<body>
  <h1>RuTube Tools <span class="badge">MP4</span></h1>
  <div class="sub" data-i18n="pop.sub"></div>

  <div class="field">
    <label class="row">
      <span class="label" data-i18n="pop.quality"></span>
      <select id="quality">
        <option value="best" data-i18n="opt.best"></option>
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
        <option value="360">360p</option>
        <option value="worst" data-i18n="opt.worst"></option>
      </select>
    </label>
  </div>

  <div class="field">
    <label class="row">
      <span class="label" data-i18n="pop.fps"></span>
      <select id="fps">
        <option value="auto" data-i18n="opt.auto"></option>
        <option value="24">24 fps</option>
        <option value="25">25 fps</option>
        <option value="30">30 fps</option>
        <option value="50">50 fps</option>
        <option value="60">60 fps</option>
      </select>
    </label>
    <div class="hint" data-i18n="pop.fpsHint"></div>
  </div>

  <div class="field">
    <label class="row">
      <span class="label" data-i18n="pop.parts"></span>
      <select id="maxPartMB">
        <option value="100">100</option>
        <option value="220">220</option>
        <option value="400">400</option>
        <option value="800">800</option>
      </select>
    </label>
    <div class="hint" data-i18n="pop.partsHint"></div>
  </div>

  <div class="sep"></div>

  <div class="field">
    <label class="row">
      <span class="label" data-i18n="pop.frameKeys"></span>
      <select id="frameKeys">
        <option value="comma" data-i18n="opt.frameComma"></option>
        <option value="brackets" data-i18n="opt.frameBrackets"></option>
        <option value="angle" data-i18n="opt.frameAngle"></option>
      </select>
    </label>
  </div>

  <div class="field">
    <label class="row">
      <span class="label" data-i18n="pop.shotKey"></span>
      <select id="shotKey">
        <option value="s" data-i18n="opt.shotS"></option>
        <option value="k" data-i18n="opt.shotK"></option>
        <option value="f" data-i18n="opt.shotF"></option>
      </select>
    </label>
  </div>

  <div class="field">
    <label class="row">
      <span class="label" data-i18n="pop.lang"></span>
      <select id="lang">
        <option value="auto" data-i18n="opt.langAuto"></option>
        <option value="ru">Русский</option>
        <option value="en">English</option>
      </select>
    </label>
  </div>

  <div class="sep"></div>

  <div class="field">
    <label class="row">
      <span class="label" data-i18n="pop.showButton"></span>
      <input type="checkbox" id="showButton">
    </label>
  </div>

  <div class="field">
    <label class="row">
      <span class="label" data-i18n="pop.youtubeKeys"></span>
      <input type="checkbox" id="youtubeKeys">
    </label>
    <div class="hint" data-i18n="pop.youtubeHint"></div>
  </div>

  <div class="field">
    <label class="row">
      <span class="label" data-i18n="pop.pitch"></span>
      <input type="checkbox" id="preservePitch">
    </label>
  </div>

  <div class="field">
    <label class="row">
      <span class="label" data-i18n="pop.remember"></span>
      <input type="checkbox" id="rememberPos">
    </label>
  </div>

  <div class="sep"></div>

  <div class="keys" id="keysHint"></div>

  <div class="foot">
    <span class="ver" id="ver"></span>
    <button id="reset" data-i18n="pop.reset"></button>
  </div>

  <script src="lib/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
