<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="RuTube Tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14141a"/><stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.14" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#f2413a" stop-opacity="0.30"/><stop offset="1" stop-color="#f2413a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.95" cy="0.1" r="0.4">
      <stop offset="0" stop-color="#ff8a5b" stop-opacity="0.14"/><stop offset="1" stop-color="#ff8a5b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5b46"/><stop offset="1" stop-color="#d92d24"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2413a" stop-opacity="0"/><stop offset="0.5" stop-color="#f2413a"/><stop offset="1" stop-color="#f2413a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#dots)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>
  <rect width="1280" height="400" fill="url(#glow2)"/>
  <rect x="0" y="0" width="1280" height="2" fill="url(#line)" opacity="0.9"/>

  <!-- знак -->
  <g transform="translate(72,118)">
    <rect width="156" height="156" rx="38" fill="url(#lg)"/>
    <rect x="1" y="1" width="154" height="154" rx="37" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="2"/>
    <g fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M78 45v52"/><path d="M54 76l24 24 24-24"/><path d="M50 118h56"/>
    </g>
  </g>

  <!-- заголовок -->
  <text x="268" y="184" font-family="Inter" font-size="64" font-weight="700" letter-spacing="-2.4" fill="#f4f5f7">RuTube Tools</text>
  <text x="270" y="226" font-family="Inter" font-size="22" font-weight="400" letter-spacing="-0.2" fill="#a2a3ad">Скачивание, звук и покадровая перемотка — прямо в плеере</text>

  <!-- чипы -->
  <g font-family="Inter" font-size="14.5" font-weight="500" fill="#e2e4e8">
    <rect x="270" y="258" width="82" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="311" y="280" text-anchor="middle">MP4</text>

    <rect x="362" y="258" width="132" height="34" rx="17" fill="#f2413a" fill-opacity="0.16" stroke="#f2413a" stroke-opacity="0.5"/>
    <text x="428" y="280" text-anchor="middle" fill="#ffb3ad">Звук · M4A</text>

    <rect x="504" y="258" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="563" y="280" text-anchor="middle">Плейлисты</text>

    <rect x="632" y="258" width="104" height="34" rx="17" fill="#f2413a" fill-opacity="0.16" stroke="#f2413a" stroke-opacity="0.5"/>
    <text x="684" y="280" text-anchor="middle" fill="#ffb3ad">Докачка</text>

    <rect x="746" y="258" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="805" y="280" text-anchor="middle">Кадры PNG</text>

    <rect x="874" y="258" width="116" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="932" y="280" text-anchor="middle">Субтитры</text>
  </g>

  <!-- версия и платформы -->
  <g>
    <rect x="1088" y="64" width="120" height="34" rx="17" fill="#f2413a" fill-opacity="0.14" stroke="#f2413a" stroke-opacity="0.55"/>
    <text x="1148" y="86" text-anchor="middle" font-family="JetBrains Mono" font-size="14" font-weight="700" fill="#ff8f86">v1.4.0</text>
  </g>
  <g font-family="JetBrains Mono" font-size="13" text-anchor="end" fill="#6f7079">
    <text x="1208" y="318">Firefox 140+ · Chromium MV3</text>
    <text x="1208" y="342">без рекламы и трекеров · MIT</text>
  </g>
</svg>
