<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>RuTube Tools</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101013;
    --panel: #16161a;
    --panel-2: #1c1c22;
    --line: rgba(255, 255, 255, .075);
    --line-2: rgba(255, 255, 255, .13);
    --ink: #eceef1;
    --dim: #9b9ca4;
    --faint: #6e6f78;
    --acc: #f2413a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 344px; padding: 14px 14px 12px;
    background: var(--bg); color: var(--ink);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* шапка */
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 3px; }
  .head img { width: 26px; height: 26px; border-radius: 7px; display: block; }
  .head h1 { font-size: 13.5px; font-weight: 650; letter-spacing: .01em; margin: 0; flex: 1; }
  .ver { font: 600 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; color: var(--faint);
         border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; }
  .sub { color: var(--faint); font-size: 11.5px; margin: 0 0 15px 36px; }

  /* группы */
  .group-label {
    font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
    color: var(--faint); margin: 16px 0 7px 2px;
  }
  .group-label:first-of-type { margin-top: 0; }
  .group { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }

  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 9px 11px; border-top: 1px solid var(--line); cursor: pointer;
  }
  .group > .row:first-child { border-top: 0; }
  .row:hover { background: rgba(255, 255, 255, .022); }
  .row.col { align-items: flex-start; }
  .row.col .hint { margin-top: 3px; }
  .row.col select, .row.col input[type=checkbox] { margin-top: 0; }
  .row .txt { min-width: 0; }
  .row .label { color: #d6d8dd; font-size: 12px; display: block; }
  .row > .label { flex: 1; }
  .row .txt { flex: 1; min-width: 0; }
  .row .hint { color: var(--faint); font-size: 10.5px; line-height: 1.4; margin-top: 2px; display: block; }

  select {
    background: var(--panel-2); color: var(--ink); border: 1px solid var(--line-2); border-radius: 7px;
    padding: 5px 7px; font-size: 11.5px; font-family: inherit; min-width: 118px; max-width: 152px; flex: 0 0 auto;
    transition: border-color .12s;
  }
  select:focus { outline: none; border-color: rgba(242, 65, 58, .6); box-shadow: 0 0 0 3px rgba(242, 65, 58, .13); }

  input[type=checkbox] {
    appearance: none; width: 32px; height: 18px; border-radius: 99px; background: #33343b;
    position: relative; cursor: pointer; transition: background .16s; flex: 0 0 auto; border: 0;
  }
  input[type=checkbox]:checked { background: var(--acc); }
  input[type=checkbox]::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
    border-radius: 50%; background: #fff; transition: transform .16s; box-shadow: 0 1px 2px rgba(0, 0, 0, .35);
  }
  input[type=checkbox]:checked::after { transform: translateX(14px); }

  kbd {
    background: rgba(255, 255, 255, .09); border: 1px solid var(--line-2); border-bottom-width: 2px;
    border-radius: 4px; padding: 0 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10.5px; color: #e6e8ec;
  }

  /* подвал с автором */
  .foot { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
  .author { display: flex; align-items: center; gap: 9px; }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center;
    background: linear-gradient(160deg, #2b2c33, #1b1b20); border: 1px solid var(--line-2);
    font: 700 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .02em; color: #cfd1d8;
  }
  .who { flex: 1; min-width: 0; line-height: 1.3; }
  .who .role { display: block; color: var(--faint); font-size: 9.5px; text-transform: uppercase; letter-spacing: .09em; }
  .who a { color: #d6d8dd; font-size: 12px; font-weight: 600; text-decoration: none; }
  .who a:hover { color: #fff; text-decoration: underline; text-underline-offset: 2px; }

  .links { display: flex; align-items: center; gap: 10px; margin-top: 11px; }
  .links a { color: var(--faint); font-size: 10.5px; text-decoration: none; }
  .links a:hover { color: #cfd1d8; }
  .links .dot { width: 3px; height: 3px; border-radius: 50%; background: #3a3b43; }

  button {
    margin-left: auto; background: transparent; color: var(--dim); border: 1px solid var(--line-2);
    border-radius: 7px; padding: 4px 9px; font-size: 10.5px; font-family: inherit; cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  button:hover { background: rgba(255, 255, 255, .06); color: var(--ink); border-color: rgba(255, 255, 255, .22); }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="head">
    <img src="icons/icon-32.png" alt="">
    <h1>RuTube Tools</h1>
    <span class="ver" id="ver"></span>
  </div>
  <p class="sub" data-i18n="pop.sub"></p>

  <div class="group-label" data-i18n="pop.secDownload"></div>
  <div class="group">
    <label class="row">
      <span class="label" data-i18n="pop.quality"></span>
      <select id="quality">
        <option value="best" data-i18n="opt.best"></option>
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
        <option value="360">360p</option>
        <option value="worst" data-i18n="opt.worst"></option>
      </select>
    </label>
    <div class="row col">
      <span class="txt">
        <label class="label" for="maxPartMB" data-i18n="pop.parts"></label>
        <span class="hint" data-i18n="pop.partsHint"></span>
      </span>
      <select id="maxPartMB">
        <option value="100">100</option>
        <option value="220">220</option>
        <option value="400">400</option>
        <option value="800">800</option>
      </select>
    </div>
  </div>

  <div class="group-label" data-i18n="pop.secKeys"></div>
  <div class="group">
    <div class="row col">
      <span class="txt">
        <label class="label" for="fps" data-i18n="pop.fps"></label>
        <span class="hint" data-i18n="pop.fpsHint"></span>
      </span>
      <select id="fps">
        <option value="auto" data-i18n="opt.auto"></option>
        <option value="24">24 fps</option>
        <option value="25">25 fps</option>
        <option value="30">30 fps</option>
        <option value="50">50 fps</option>
        <option value="60">60 fps</option>
      </select>
    </div>
    <label class="row">
      <span class="label" data-i18n="pop.frameKeys"></span>
      <select id="frameKeys">
        <option value="comma" data-i18n="opt.frameComma"></option>
        <option value="brackets" data-i18n="opt.frameBrackets"></option>
        <option value="angle" data-i18n="opt.frameAngle"></option>
      </select>
    </label>
    <label class="row">
      <span class="label" data-i18n="pop.shotKey"></span>
      <select id="shotKey">
        <option value="s" data-i18n="opt.shotS"></option>
        <option value="k" data-i18n="opt.shotK"></option>
        <option value="f" data-i18n="opt.shotF"></option>
      </select>
    </label>
    <div class="row col">
      <span class="txt">
        <label class="label" for="youtubeKeys" data-i18n="pop.youtubeKeys"></label>
        <span class="hint" data-i18n="pop.youtubeHint"></span>
      </span>
      <input type="checkbox" id="youtubeKeys">
    </div>
  </div>

  <div class="group-label" data-i18n="pop.secBehavior"></div>
  <div class="group">
    <label class="row">
      <span class="label" data-i18n="pop.showButton"></span>
      <input type="checkbox" id="showButton">
    </label>
    <label class="row">
      <span class="label" data-i18n="pop.pitch"></span>
      <input type="checkbox" id="preservePitch">
    </label>
    <label class="row">
      <span class="label" data-i18n="pop.remember"></span>
      <input type="checkbox" id="rememberPos">
    </label>
    <label class="row">
      <span class="label" data-i18n="pop.lang"></span>
      <select id="lang">
        <option value="auto" data-i18n="opt.langAuto"></option>
        <option value="ru">Русский</option>
        <option value="en">English</option>
      </select>
    </label>
  </div>

  <div class="sub" id="keysHint" style="margin:11px 0 0 2px"></div>

  <div class="foot">
    <div class="author">
      <span class="avatar" aria-hidden="true">xx</span>
      <span class="who">
        <span class="role" data-i18n="pop.developer"></span>
        <a href="https://github.com/xxnetme" target="_blank" rel="noopener noreferrer">xxnetme</a>
      </span>
      <button id="reset" data-i18n="pop.reset"></button>
    </div>
    <div class="links">
      <a href="https://github.com/xxnetme/rutube-tools" target="_blank" rel="noopener noreferrer" data-i18n="pop.source"></a>
      <span class="dot"></span>
      <a href="https://github.com/xxnetme/rutube-tools/blob/main/docs/PRIVACY.md" target="_blank" rel="noopener noreferrer" data-i18n="pop.privacy"></a>
    </div>
  </div>

  <script src="lib/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
